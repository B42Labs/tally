# The resource type prices one metric twice.
version: "2026-03"
valid_from: "2026-03-01T00:00:00Z"
currency: "EUR"

pricing:
  openstack:
    instance:
      dimensions:
        - metric: "vcpus"
          type: "time_gauge"
          price_per_unit_hour: "0.02"
        - metric: "vcpus"
          type: "counter"
          price_per_unit: "0.09"
