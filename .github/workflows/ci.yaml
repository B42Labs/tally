name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Integration tests added by later work packages use testcontainers, which
      # needs Docker. The GitHub-hosted runner provides it; kind is never used in CI.
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The rules file and the Alertmanager config are validated by the pinned
      # images the cluster runs, so this step needs the same Docker the note
      # above names.
      - name: alerting
        run: make check-alerting

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # VitePress fails the build on a dead internal link (ignoreDeadLinks is
      # not set in docs/.vitepress/config.mts), so this step is the link check.
      # The frontmatter, heading and sidebar gates run in the test step of the
      # ci job as part of go test ./...
      - run: npm run docs:build
