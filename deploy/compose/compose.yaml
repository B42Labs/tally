# The OpenStack simulator stack.
#
# Three containers on the developer's machine: a RabbitMQ broker, the collector
# image, and the simulator, which publishes a generated month of
# oslo.messaging notifications onto the broker. The collector consumes them and
# posts the events into the Reporting API of the kind dev cluster `make up`
# created, so a month of usage reaches the dev database without an OpenStack
# deployment anywhere.
#
# Every host port below is bound to 127.0.0.1 and lies above 1024. Docker
# Desktop publishes a privileged port only through a helper that is not
# installed on every Mac, and a mapping without an address publishes on every
# interface the machine has; deploy/kind/kind.yaml states the same rule for the
# cluster's own ports.
#
# The values interpolated below come from deploy/compose/.env, which
# `make simulator-up` writes and git ignores. It carries the cloud, the period,
# the seed, the factor, the fault switches, the OTLP user and password, the
# metrics interval, and the ingest token issued for that cloud. It also carries
# the registry switch, the cloud the simulated Gardener projects are registered
# under, and the admin api token that registers them, which is the empty string
# unless the switch is on.
#
# A named volume of one of these images belongs under /home/nonroot; the
# collector's outbox below says why.
name: tally-simulator

services:
  # The bus. The management UI shows the queue the collector binds and how far
  # behind it is, which is where a stalled pipeline becomes visible.
  rabbitmq:
    # Pinned to a version and a digest, the way deploy/kind/kind.yaml pins the
    # node image: a floating tag re-resolves on every pull, so the broker the
    # stack runs would be whatever the registry published under it last.
    image: rabbitmq:4.3.5-management-alpine@sha256:ac1201d1dc227779d93c607f976e7f9156fd5b551ee5ff7946cab6c242091bf3
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # Both other services wait on this, so neither dials a broker that is still
    # starting.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 12

  # The collector image, running unmodified: nothing in it knows the
  # notifications it consumes are generated.
  collector:
    image: tally-openstack-collector:dev
    # `make images` builds the tag locally and no registry carries it.
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TALLY_OSC_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      # The simulator publishes on four exchanges the collector's default leaves
      # out: octavia carries the shoots' load balancers, keystone the tenant and
      # authentication records, designate the zones and record sets, and
      # barbican the certificate audit records. A topic exchange copies a
      # message only to the queues bound to it, so a collector left at its
      # default of four sees none of them in any counter, neither as an event
      # nor as a skip.
      TALLY_OSC_EXCHANGES: nova,neutron,cinder,glance,octavia,keystone,designate,barbican
      TALLY_OSC_CLOUD: ${TALLY_SIM_CLOUD}
      TALLY_OSC_REPORTING_URL: https://api.tally.127-0-0-1.nip.io:8443
      TALLY_OSC_TOKEN: ${TALLY_OSC_TOKEN}
      TALLY_OSC_BUFFER_PATH: /home/nonroot/outbox.db
      # The dev CA is in no root store the distroless image carries, and the
      # sender is a plain http.Client, so this file is what makes the Gateway's
      # certificate verify.
      SSL_CERT_FILE: /etc/tally/tally-ca.crt
    # Maps the Gateway's host name to the host, so the container reaches the
    # kind port published on the host's 127.0.0.1:8443. Verified on this
    # project's Docker Desktop.
    extra_hosts:
      - "api.tally.127-0-0-1.nip.io:host-gateway"
    volumes:
      - "../../tally-ca.crt:/etc/tally/tally-ca.crt:ro"
      # The outbox sits under /home/nonroot because the image runs as nonroot
      # (uid 65532) and Docker gives a fresh named volume the ownership of the
      # directory it is mounted over, which for /home/nonroot in the distroless
      # image is uid 65532. A volume mounted at a path the image does not carry
      # is root-owned, and the collector cannot open its outbox in it.
      - "outbox:/home/nonroot"
    ports:
      # /metrics, /readyz, /healthz
      - "127.0.0.1:8090:8080"

  # The producing side. It generates the month from the seed and the period and
  # publishes it in the wall time the factor compresses it into.
  simulator:
    image: tally-openstack-simulator:dev
    pull_policy: never
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TALLY_SIM_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      TALLY_SIM_CLOUD: ${TALLY_SIM_CLOUD}
      # The control endpoint binds loopback unless it is told otherwise, and
      # loopback inside the container is reachable from nothing. The port below
      # is what publishes it, on the host's 127.0.0.1 alone.
      TALLY_SIM_HTTP_ADDR: 0.0.0.0
      # The three below are read only with --register-projects and ignored
      # otherwise. The CA is here for the reason the collector's comment gives:
      # the registrar posts to the Gateway over the same kind of plain
      # http.Client, so this file is what makes its certificate verify.
      TALLY_SIM_REPORTING_URL: https://api.tally.127-0-0-1.nip.io:8443
      TALLY_SIM_API_TOKEN: ${TALLY_SIM_API_TOKEN}
      TALLY_SIM_GARDEN_CLOUD: ${TALLY_SIM_GARDEN_CLOUD}
      SSL_CERT_FILE: /etc/tally/tally-ca.crt
      # The OTLP/HTTP route the dev Gateway publishes in front of the cluster's
      # OpenTelemetry collector. The traffic counters and the inventory gauges
      # of the month go there. The CA mounted below and SSL_CERT_FILE are what
      # make the Gateway's certificate verify on this path too, and
      # TALLY_SIM_OTLP_INSECURE stays unset because the endpoint is https.
      TALLY_SIM_OTLP_URL: https://otlp.tally.127-0-0-1.nip.io:8443/v1/metrics
      # The credential the dev overlay generates into tally-otlp-auth, written
      # into .env by `make simulator-up`.
      TALLY_SIM_OTLP_USER: ${TALLY_SIM_OTLP_USER}
      TALLY_SIM_OTLP_PASSWORD: ${TALLY_SIM_OTLP_PASSWORD}
    # Both mirror the collector's above and are there for the reasons given
    # with them. The second name is the OTLP route on the same Gateway, mapped
    # to the host the same way.
    extra_hosts:
      - "api.tally.127-0-0-1.nip.io:host-gateway"
      - "otlp.tally.127-0-0-1.nip.io:host-gateway"
    volumes:
      - "../../tally-ca.crt:/etc/tally/tally-ca.crt:ro"
    # --metrics-interval reaches the binary as a flag the way --factor does. It
    # is the grid the traffic counters and the inventory gauges of the month lie
    # on.
    #
    # --faults is empty unless SIM_FAULTS names a switch. An empty value reaches
    # the binary as --faults "", which is an empty list of switch names, and an
    # empty list is the run with every switch off.
    #
    # --allow-remote-broker is the confirmation the binary asks for before it
    # dials a broker that is not on its own machine. The broker here is the
    # container next door, and what it carries is thrown away with the stack; a
    # URL that named a control plane's broker would put a month of invented usage
    # into that deployment's billing data, which is why the flag has to be typed.
    #
    # --register-projects carries its value in the same argument because that is
    # where pflag reads a boolean flag's value from. A separate `false` would
    # reach the binary as a positional argument, and cobra.NoArgs refuses those.
    command: ["run", "--period", "${TALLY_SIM_PERIOD}", "--seed", "${TALLY_SIM_SEED}", "--factor", "${TALLY_SIM_FACTOR}", "--metrics-interval", "${TALLY_SIM_METRICS_INTERVAL}", "--faults", "${TALLY_SIM_FAULTS}", "--register-projects=${TALLY_SIM_REGISTER_PROJECTS}", "--allow-remote-broker"]
    ports:
      # the control endpoint: GET /clock, PUT /clock, POST /release, GET /healthz,
      # GET /metrics, which is the inventory the dev cluster's
      # openstack-db-exporter scrape job reads off host.docker.internal:8091,
      # and the fake OpenStack API a run serves on the same listener
      - "127.0.0.1:8091:8080"

volumes:
  # Everything the collector has consumed and not yet delivered lives here and
  # nowhere else.
  outbox: {}
