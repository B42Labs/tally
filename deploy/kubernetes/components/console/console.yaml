# The console. It renders periods, runs and statements out of the Reporting API
# and the engine database, and it writes to neither.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
spec:
  # Nothing in the pod is state, so the default rolling update replaces it
  # without a gap. One replica is enough for one operator, and a second would
  # not share the sign-in's comparison slots or the digest it remembers, which
  # are per process.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
    spec:
      # The console calls no Kubernetes API, so the token of the default
      # ServiceAccount would be an exposure and nothing else.
      automountServiceAccountToken: false
      # The image ends in distroless nonroot with USER nonroot:nonroot, which
      # names an identity and nothing more; this is what asks the kubelet to
      # hold the pod to it. 65532 is that user. There is no fsGroup: the console
      # writes no volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      # No init container waits for the database. The engine pool connects
      # lazily, so the console starts while TimescaleDB is not up yet, and a
      # page that reads it reports the outage.
      containers:
        - name: console
          image: tally-console:dev
          # What the block above does not reach. These four are per-container
          # and every one of them defaults the permissive way. The console
          # needs none of it: it dials the Reporting API and the database,
          # serves two unprivileged ports, and writes nothing to disk. The
          # operator's htpasswd line, the API token and the database password
          # are mounted into this container, which is what the confinement is
          # worth.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Without a request the pod is BestEffort and first in line for
          # eviction, and the operator meets the Gateway's 503 instead of a page.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # http carries the pages behind the sign-in, and ops the probes and
          # /metrics without it. They are named so that the Service, the route
          # and the scrape job can refer to them.
          ports:
            - name: http
              containerPort: 8095
            - name: ops
              containerPort: 8096
          env:
            # Both listeners bind this address. The default, 127.0.0.1, is one
            # neither the kubelet nor the Gateway reaches.
            - name: TALLY_CONSOLE_HTTP_ADDR
              value: 0.0.0.0
            - name: TALLY_CONSOLE_HTTP_PORT
              value: "8095"
            - name: TALLY_CONSOLE_OPS_PORT
              value: "8096"
            # The Service of the Reporting API in this namespace, over plain
            # HTTP. The link does not depend on the DNS name or the certificate
            # of the Gateway, and it stays inside the namespace.
            - name: TALLY_CONSOLE_REPORTING_URL
              value: http://reporting-api
            - name: TALLY_CONSOLE_REPORTING_INSECURE
              value: "true"
            # Secrets follow the *_FILE convention so they arrive as a mounted
            # file rather than an environment value.
            - name: TALLY_CONSOLE_API_TOKEN_FILE
              value: /run/secrets/tally-console-token/api-token
            - name: TALLY_CONSOLE_ENGINE_DB_URL_FILE
              value: /run/secrets/tally-console-db/db-url
            - name: TALLY_CONSOLE_HTPASSWD_FILE
              value: /run/secrets/tally-console-auth/htpasswd
          volumeMounts:
            - name: api-token
              mountPath: /run/secrets/tally-console-token
              readOnly: true
            - name: db-url
              mountPath: /run/secrets/tally-console-db
              readOnly: true
            - name: htpasswd
              mountPath: /run/secrets/tally-console-auth
              readOnly: true
          # Neither probe reads the Reporting API or the database: restarting
          # the pod mends neither side, and taking it out of the Service would
          # replace the page that names the failed side with the Gateway's 503.
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        # No overlay generates this Secret: the operator creates it from the
        # output of create-api-token, and on the dev stack `make up` does.
        # Until it exists the pod waits in ContainerCreating, and it starts on
        # its own afterwards.
        - name: api-token
          secret:
            secretName: tally-console-token
            items:
              - key: api-token
                path: api-token
        - name: db-url
          secret:
            secretName: tally-console-db
            items:
              - key: db-url
                path: db-url
        - name: htpasswd
          secret:
            secretName: tally-console-auth
            items:
              - key: htpasswd
                path: htpasswd
---
# The port ops exists for the store's console job, which discovers the pod
# through the endpointslice of this Service; no route names it. A pod that is
# not ready stays a target, because endpointslice discovery keeps addresses
# that are not ready.
apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
spec:
  selector:
    app.kubernetes.io/name: console
  ports:
    - name: http
      port: 8095
      targetPort: http
    - name: ops
      port: 8096
      targetPort: ops
---
# The pages under their own hostname. The probes and the metrics stay off it,
# because they listen on ops: the page port answers /healthz, /readyz and
# /metrics with 401 like any other path, and with 404 once signed in.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
spec:
  parentRefs:
    - name: tally
      sectionName: https
  hostnames:
    - console.tally.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: console
          port: 8095
