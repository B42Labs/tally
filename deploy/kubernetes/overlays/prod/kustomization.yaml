# The dedicated cluster: the stack on a public domain.
#
# The Reporting API, the OTLP collector, the store, the alerting pair and
# Grafana run here, under the hostnames hosts.yaml names and behind a
# certificate Let's Encrypt signs. The OpenStack collector runs here too: it
# consumes the notifications of the cloud collector.env names from a broker
# outside the cluster and posts them to the Reporting API. The cluster migrates,
# rates and reconciles by itself: Job tally-migrate applies both migration
# chains on every apply, the hourly CronJob tally-engine rates a month once a
# pricing catalog prices it, and CronJob tally-sync reconciles the cloud every
# ten minutes. Nothing that answers without a credential is published.
#
# issuers.yaml is deliberately not listed here; see the comment in that file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tally

# hosts.yaml is read by the replacements at the end of this file and never
# emitted. There is no envoyproxy.yaml: Envoy Gateway's default Service type is
# LoadBalancer, which is what this cluster provides. That LoadBalancer has to
# pass the client's address on: the OTLP rate limit of the envoy-gateway
# component keeps one bucket per address, and behind a LoadBalancer that
# proxies connections every publisher draws from the bucket of the
# LoadBalancer's own address.
resources:
  - namespace.yaml
  - ../../base
  - hosts.yaml

# This cluster runs Envoy Gateway, so it lists what the base leaves to it: the
# GatewayClass, the OTLP rate limit and the two 403 answers. kustomize applies
# the component before the patches below, which is why one of them can delete
# a filter the component declares.
#
# The second component is the collector: a Deployment with its outbox on a
# claim. The third is Job tally-migrate, which applies both migration chains
# with the CLIs of the release, and the fourth is CronJob tally-sync with the
# mount of the two files the Reporting API reconciles with. The
# kustomization.yaml of each states what an overlay has to supply, which the
# images, secretGenerator and configMapGenerator entries below do, all but the
# Secret of the ingest token.
components:
  - ../../components/envoy-gateway
  - ../../components/openstack-collector
  - ../../components/migrations
  - ../../components/reconciliation

# The four images the release workflow publishes: the Reporting API, the
# collector, the engine the scheduler and the migration Job run, and the admin
# CLI the migration Job applies the reporting chain with. The overlay deploys
# one release, so every entry carries one tag: the operator moves all four on
# every release, `make prod-up` refuses two different ones, and the tag has to
# exist in the registry before it runs. The release workflow publishes the
# collector and the admin image from the first release after v0.3.0 on: at
# v0.3.0 itself no registry holds them, and a deployment moves every tag to a
# later release.
images:
  - name: tally-reporting
    newName: ghcr.io/b42labs/tally-reporting
    newTag: v0.5.0
  - name: tally-openstack-collector
    newName: ghcr.io/b42labs/tally-openstack-collector
    newTag: v0.5.0
  - name: tally-engine
    newName: ghcr.io/b42labs/tally-engine
    newTag: v0.5.0
  - name: tally-reporting-admin
    newName: ghcr.io/b42labs/tally-reporting-admin
    newTag: v0.5.0

# The credentials of this cluster. Each file is untracked and copied from the
# .example beside it, which says how to fill every key. `make prod-up` checks
# that each exists with every key of its example and every value filled in
# before it applies anything.
#
# tally-reconciliation-auth is the clouds.yaml the Reporting API authenticates
# against the cloud with, generated as one file under its own name, which is
# the key the reconciliation component mounts.
#
# tally-collector-token, the Secret of the collector's ingest token, is in no
# generator. A credential can be issued only against the migrated database, so
# the operator creates the Secret with kubectl from the output of
# `tally-reporting-admin create-ingest-credential` after the first
# `make prod-up`. The collector pod waits in ContainerCreating until then.
secretGenerator:
  - name: tally-db
    envs:
      - secrets/tally-db.env
  - name: tally-internal-token
    envs:
      - secrets/tally-internal-token.env
  - name: tally-otlp-auth
    envs:
      - secrets/tally-otlp-auth.env
  - name: tally-grafana
    envs:
      - secrets/tally-grafana.env
  - name: tally-vm-admin
    envs:
      - secrets/tally-vm-admin.env
  - name: tally-collector-amqp
    envs:
      - secrets/tally-collector-amqp.env
  - name: tally-reconciliation-auth
    files:
      - secrets/clouds.yaml

# The scrape config of this cluster, in place of the base's. What the file
# keeps, and why, is written in its own header.
#
# The second entry is the non-secret settings of the collector, one variable
# per line of collector.env. The file is tracked and ships with an empty
# TALLY_OSC_CLOUD, which `make prod-up` refuses.
#
# The third is the cloud the Reporting API reconciles, which the sync names
# through the collector's TALLY_OSC_CLOUD. The file is tracked, edited in place
# like collector.env, and ships with empty names, which `make prod-up` refuses.
configMapGenerator:
  - name: victoriametrics-scrape
    behavior: replace
    files:
      - victoriametrics/scrape.yaml
  - name: tally-openstack-collector
    envs:
      - collector.env
  - name: tally-reconciliation
    files:
      - reconciliation/clouds-config.yaml

patches:
  # The UIs of the store, vmalert and Alertmanager answer without a credential,
  # so their routes are not published here, and neither is the filter the
  # envoy-gateway component declares for the Alertmanager route.
  # docs/how-to/observability/deploy-alerting.md tells a deployment beyond
  # localhost to publish neither alerting route. The operator reaches all three
  # with kubectl port-forward.
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: victoriametrics
      $patch: delete

  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: vmalert
      $patch: delete

  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: alertmanager
      $patch: delete

  - patch: |
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: HTTPRouteFilter
      metadata:
        name: alertmanager-deny-writes
      $patch: delete

  # Grafana answers /metrics on the port its route publishes, without a
  # credential, and nothing on this cluster scrapes it.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            containers:
              - name: grafana
                env:
                  - name: GF_METRICS_ENABLED
                    value: "false"

  # Behind a LoadBalancer the postgres listener would put the database on the
  # internet, so neither it nor its route exists here. The migrations run in
  # Job tally-migrate, and the admin CLI and the engine CLI reach the database
  # through a port-forward. Index 2 is the listener named postgres in the
  # base's gateway.yaml, which manifest_test.go checks.
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1alpha2
      kind: TCPRoute
      metadata:
        name: timescaledb
      $patch: delete

  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: tally
    patch: |
      - op: remove
        path: /spec/listeners/2

  # Let's Encrypt issues a wildcard only over DNS-01, so the certificate names
  # the four published hostnames instead. The entries are the keys of
  # hosts.yaml, which the replacements below overwrite with their values. The
  # Certificate keeps the base's name and secretName, which the https listener
  # references.
  - target:
      group: cert-manager.io
      kind: Certificate
      name: tally-wildcard
    patch: |
      - op: replace
        path: /spec/dnsNames
        value:
          - api
          - otlp
          - otlp-grpc
          - grafana
      - op: replace
        path: /spec/issuerRef/name
        value: letsencrypt

# Every hostname and external URL comes from hosts.yaml. The URL targets split
# the value at "://" and replace the part after it, so the https scheme stays.
# vmalert and Alertmanager take their URLs although their routes are deleted
# above, so the links they render are right on the day the routes are published
# behind an authenticating proxy.
replacements:
  - source:
      kind: ConfigMap
      name: tally-hosts
      fieldPath: data.api
    targets:
      - select:
          kind: HTTPRoute
          name: reporting-api
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: tally-wildcard
        fieldPaths:
          - spec.dnsNames.0

  - source:
      kind: ConfigMap
      name: tally-hosts
      fieldPath: data.otlp
    targets:
      - select:
          kind: HTTPRoute
          name: otel-collector-http
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: tally-wildcard
        fieldPaths:
          - spec.dnsNames.1

  - source:
      kind: ConfigMap
      name: tally-hosts
      fieldPath: data.otlp-grpc
    targets:
      - select:
          kind: GRPCRoute
          name: otel-collector-grpc
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: tally-wildcard
        fieldPaths:
          - spec.dnsNames.2

  - source:
      kind: ConfigMap
      name: tally-hosts
      fieldPath: data.grafana
    targets:
      - select:
          kind: HTTPRoute
          name: grafana
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: tally-wildcard
        fieldPaths:
          - spec.dnsNames.3
      - select:
          kind: Deployment
          name: grafana
        fieldPaths:
          - spec.template.spec.containers.[name=grafana].env.[name=GF_SERVER_ROOT_URL].value
        options:
          delimiter: "://"
          index: 1

  - source:
      kind: ConfigMap
      name: tally-hosts
      fieldPath: data.vmalert
    targets:
      - select:
          kind: Deployment
          name: vmalert
        fieldPaths:
          - spec.template.spec.containers.[name=vmalert].env.[name=VMALERT_EXTERNAL_URL].value
        options:
          delimiter: "://"
          index: 1

  - source:
      kind: ConfigMap
      name: tally-hosts
      fieldPath: data.alertmanager
    targets:
      - select:
          kind: StatefulSet
          name: alertmanager
        fieldPaths:
          - spec.template.spec.containers.[name=alertmanager].env.[name=ALERTMANAGER_EXTERNAL_URL].value
        options:
          delimiter: "://"
          index: 1
