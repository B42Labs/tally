# How the Reporting API authenticates against the simulated cloud.
#
# The credentials are the simulator's fixed dev pair: it accepts exactly this
# user and password, and a drawn password would be one nobody could write into
# a clouds.yaml either.
#
# The compose stack publishes the simulator on the host at 127.0.0.1:8091, and
# host.docker.internal is the name a pod in the kind node resolves that host by
# under Docker Desktop.
clouds:
  os-sim:
    auth:
      auth_url: http://host.docker.internal:8091/v3
      username: tally-sync
      password: tally-dev-sync-password
      project_id: 4c9d2f6b81e34a7f9b3c5d8e0a1f2b34
      user_domain_name: Default
    region_name: RegionOne
    interface: public
