# The kind dev environment.
#
# Every service gets a real HTTPS URL under *.tally.127-0-0-1.nip.io. nip.io
# resolves that wildcard to 127.0.0.1, so no /etc/hosts edit is needed, and the
# self-signed CA in issuers.yaml signs the certificate the Gateway serves.
#
# issuers.yaml is deliberately not listed here; see the comment in that file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tally

resources:
  - namespace.yaml
  - ../../base
  - envoyproxy.yaml

# Dev credentials, in the clear on purpose: this database is reachable only
# through a Gateway bound to 127.0.0.1 on the developer's own machine.
secretGenerator:
  - name: tally-db
    literals:
      - password=tally-dev-password
      - db-url=postgres://tally:tally-dev-password@timescaledb:5432/tally_reporting?sslmode=disable
      # What the initdb script creates the engine's login role with, and what
      # TALLY_ENGINE_REPORTING_DB_URL carries on this cluster.
      - engine-password=tally-dev-password
      # The engine's own database, which it writes its runs and records to.
      - engine-db-url=postgres://tally:tally-dev-password@timescaledb:5432/tally_engine?sslmode=disable
      # The reporting database, read as the login role
      # deploy/kubernetes/base/timescaledb/02-create-engine-reader.sh creates.
      # It is a member of the group role the reporting chain grants SELECT to,
      # so this connection reads the four metering tables and nothing else.
      - engine-reporting-db-url=postgres://tally_engine:tally-dev-password@timescaledb:5432/tally_reporting?sslmode=disable
  - name: tally-internal-token
    literals:
      - token=tally-dev-internal-token
  # The OTLP receivers read this as an htpasswd file. A plain user:password
  # line is one of the formats it takes; a real deployment puts a bcrypt hash
  # here instead.
  - name: tally-otlp-auth
    literals:
      - htpasswd=tally:tally-dev-otlp-password
  # The key has to be admin-password: the Grafana Deployment reads the secret
  # from /run/secrets/tally-grafana/admin-password and mounts that one key, so
  # any other key fails the mount and the pod never starts.
  - name: tally-grafana
    literals:
      - admin-password=tally-dev-grafana-password
  # What VictoriaMetrics takes as -deleteAuthKey. Its only job is to stop
  # /api/v1/admin/tsdb/delete_series answering an unauthenticated caller, which
  # anything that can reach the store is otherwise able to do; a dev value in
  # the clear is enough for that, the same as the credentials above.
  - name: tally-vm-admin
    literals:
      - delete-auth-key=tally-dev-vm-delete-key
  # How the Reporting API authenticates against the cloud it reconciles. The file
  # carries a cloud password, so it is generated here rather than into the
  # ConfigMap the rest of the reconciliation config goes to: a ConfigMap is
  # readable by everything the built-in view role is bound to, and the drill of
  # another cloud edits this file in place.
  - name: tally-reconciliation-auth
    files:
      - reconciliation/clouds.yaml

# What the Reporting API reconciles here. The file is mounted by the patch at the
# end of this file, beside the clouds.yaml of the Secret above. Generating the
# ConfigMap from it means editing it re-rolls the pod through the generated name
# hash, rather than leaving it syncing by a config that no longer matches the
# tree.
configMapGenerator:
  - name: tally-reconciliation
    files:
      - reconciliation/clouds-config.yaml
  # The scrape config of this cluster, in place of the base's. A generator for
  # the same name marked behavior: replace overrides a generated ConfigMap,
  # which is the mechanism docs/openstack-metrics.md documents under "Replacing
  # the placeholders"; the generated name still carries a hash of the content,
  # so editing the file re-rolls the VictoriaMetrics pod. What the overlay's
  # file changes against the base is written in its own header.
  - name: victoriametrics-scrape
    behavior: replace
    files:
      - victoriametrics/scrape.yaml
  # What the scheduler measures beyond the drafts metering folds: the egress of
  # a simulated instance, out of the counter the simulator pushes. Generated
  # from the file for the same reason as the reconciliation config above, and
  # mounted by the last patch in this file.
  - name: tally-counter-sources
    files:
      - counter-sources.yaml

patches:
  # Route every service to its nip.io hostname.
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: reporting-api
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoriametrics
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: vm.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: otel-collector-http
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: otlp.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: otel-collector-grpc
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: otlp-grpc.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: grafana.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vmalert
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: vmalert.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: alertmanager.tally.127-0-0-1.nip.io

  # Serve that domain, signed by the dev CA.
  - target:
      group: cert-manager.io
      kind: Certificate
      name: tally-wildcard
    patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.tally.127-0-0-1.nip.io"
      - op: replace
        path: /spec/issuerRef/name
        value: tally-dev-ca

  # The browser follows the redirect on the host side, where https is published
  # on 8443 rather than 443 (deploy/kind/kind.yaml), so the Location header has
  # to carry that port. Without it the redirect points at a closed port.
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-to-https
    patch: |
      - op: add
        path: /spec/rules/0/filters/0/requestRedirect/port
        value: 8443

  # Point the Gateway at the proxy config that pins the node ports.
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: tally
    patch: |
      - op: add
        path: /spec/infrastructure
        value:
          parametersRef:
            group: gateway.envoyproxy.io
            kind: EnvoyProxy
            name: tally-proxy-config

  # The image is built locally and side-loaded with `kind load`, so pulling it
  # would only ever fail.
  - target:
      kind: Deployment
      name: reporting-api
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # The image is built locally and side-loaded with `kind load`, so pulling it
  # would only ever fail.
  - target:
      kind: CronJob
      name: tally-engine
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # The five strategic merge patches in this file. They merge env entries by
  # name, so each names only the variables it sets instead of indexing into the
  # base env list, where a reorder in the base would move the values onto the
  # wrong variables.
  #
  # The root URL carries the 8443 host port for the same reason the redirect
  # above does: kind publishes https there, so a link Grafana renders without
  # the port sends the browser to a closed port. The anonymous settings give an
  # unauthenticated request the viewer role, which reads dashboards and saves
  # nothing; admin still signs in with the generated password.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            containers:
              - name: grafana
                env:
                  - name: GF_SERVER_ROOT_URL
                    value: https://grafana.tally.127-0-0-1.nip.io:8443
                  - name: GF_AUTH_ANONYMOUS_ENABLED
                    value: "true"
                  - name: GF_AUTH_ANONYMOUS_ORG_ROLE
                    value: Viewer

  # The placeholder external URL, in the host-port form for the same reason.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vmalert
      spec:
        template:
          spec:
            containers:
              - name: vmalert
                env:
                  - name: VMALERT_EXTERNAL_URL
                    value: https://vmalert.tally.127-0-0-1.nip.io:8443

  # The same placeholder on the other side of the pair.
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: alertmanager
      spec:
        template:
          spec:
            containers:
              - name: alertmanager
                env:
                  - name: ALERTMANAGER_EXTERNAL_URL
                    value: https://alertmanager.tally.127-0-0-1.nip.io:8443

  # The simulated cloud the compose stack serves, mounted read-only from the two
  # generators above: the clouds config out of the ConfigMap and the clouds.yaml
  # out of the Secret, projected into the one directory the two variables point
  # at. Each source names its generator by its unsuffixed name; the name
  # reference transformer rewrites both to the generated ones, so the hash a file
  # edit changes reaches the pod.
  #
  # The clouds.yaml the pod authenticates with points at
  # host.docker.internal:8091, which is where a pod in the kind node reaches the
  # simulator the compose stack publishes on the host.
  #
  # TALLY_REPORTING_SYNC_ALLOW_AT lets a sync request name the instant it
  # reconciles at. The simulated cloud runs on a generated month rather than on
  # the wall clock, so a sync at wall time would observe it outside its period.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: reporting-api
      spec:
        template:
          spec:
            containers:
              - name: reporting-api
                env:
                  - name: TALLY_REPORTING_CLOUDS_CONFIG
                    value: /etc/tally/clouds/clouds-config.yaml
                  - name: OS_CLIENT_CONFIG_FILE
                    value: /etc/tally/clouds/clouds.yaml
                  - name: TALLY_REPORTING_SYNC_ALLOW_AT
                    value: "true"
                volumeMounts:
                  - name: clouds
                    mountPath: /etc/tally/clouds
                    readOnly: true
            volumes:
              - name: clouds
                projected:
                  sources:
                    - configMap:
                        name: tally-reconciliation
                    - secret:
                        name: tally-reconciliation-auth

  # What the dev engine measures counters from. The base keeps
  # TALLY_ENGINE_COUNTER_SOURCES empty, which is the zero configuration that
  # works without a mounted file (see TestCounterSourcesIsSetToTheEmptyPath in
  # deploy/kubernetes/base/tally-engine); this overlay mounts the ConfigMap the
  # generator above builds and points the variable at the file inside it, so the
  # tick measures the egress counter the simulator pushes. The volume names the
  # generator by its unsuffixed name and the name reference transformer rewrites
  # it to the hashed one, the same as the two sources of the clouds volume.
  - patch: |
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: tally-engine
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: tally-engine
                    env:
                      - name: TALLY_ENGINE_COUNTER_SOURCES
                        value: /etc/tally/counter-sources.yaml
                    volumeMounts:
                      - name: counter-sources
                        mountPath: /etc/tally
                        readOnly: true
                volumes:
                  - name: counter-sources
                    configMap:
                      name: tally-counter-sources
