# The kind dev environment.
#
# Every service gets a real HTTPS URL under *.tally.127-0-0-1.nip.io. nip.io
# resolves that wildcard to 127.0.0.1, so no /etc/hosts edit is needed, and the
# self-signed CA in issuers.yaml signs the certificate the Gateway serves.
#
# issuers.yaml is deliberately not listed here; see the comment in that file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tally

resources:
  - namespace.yaml
  - ../../base
  - envoyproxy.yaml

# Dev credentials, in the clear on purpose: this database is reachable only
# through a Gateway bound to 127.0.0.1 on the developer's own machine.
secretGenerator:
  - name: tally-db
    literals:
      - password=tally-dev-password
      - db-url=postgres://tally:tally-dev-password@timescaledb:5432/tally_reporting?sslmode=disable
      # What the initdb script creates the engine's login role with, and what
      # TALLY_ENGINE_REPORTING_DB_URL carries on this cluster.
      - engine-password=tally-dev-password
      # The engine's own database, which it writes its runs and records to.
      - engine-db-url=postgres://tally:tally-dev-password@timescaledb:5432/tally_engine?sslmode=disable
      # The reporting database, read as the login role
      # deploy/kubernetes/base/timescaledb/02-create-engine-reader.sh creates.
      # It is a member of the group role the reporting chain grants SELECT to,
      # so this connection reads the four metering tables and nothing else.
      - engine-reporting-db-url=postgres://tally_engine:tally-dev-password@timescaledb:5432/tally_reporting?sslmode=disable
  - name: tally-internal-token
    literals:
      - token=tally-dev-internal-token
  # The OTLP receivers read this as an htpasswd file. A plain user:password
  # line is one of the formats it takes; a real deployment puts a bcrypt hash
  # here instead.
  - name: tally-otlp-auth
    literals:
      - htpasswd=tally:tally-dev-otlp-password
  # The key has to be admin-password: the Grafana Deployment reads the secret
  # from /run/secrets/tally-grafana/admin-password and mounts that one key, so
  # any other key fails the mount and the pod never starts.
  - name: tally-grafana
    literals:
      - admin-password=tally-dev-grafana-password
  # What VictoriaMetrics takes as -deleteAuthKey. Its only job is to stop
  # /api/v1/admin/tsdb/delete_series answering an unauthenticated caller, which
  # anything that can reach the store is otherwise able to do; a dev value in
  # the clear is enough for that, the same as the credentials above.
  - name: tally-vm-admin
    literals:
      - delete-auth-key=tally-dev-vm-delete-key

patches:
  # Route every service to its nip.io hostname.
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: reporting-api
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: api.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoriametrics
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: vm.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: otel-collector-http
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: otlp.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: otel-collector-grpc
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: otlp-grpc.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: grafana.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vmalert
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: vmalert.tally.127-0-0-1.nip.io

  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: alertmanager.tally.127-0-0-1.nip.io

  # Serve that domain, signed by the dev CA.
  - target:
      group: cert-manager.io
      kind: Certificate
      name: tally-wildcard
    patch: |
      - op: replace
        path: /spec/dnsNames/0
        value: "*.tally.127-0-0-1.nip.io"
      - op: replace
        path: /spec/issuerRef/name
        value: tally-dev-ca

  # The browser follows the redirect on the host side, where https is published
  # on 8443 rather than 443 (deploy/kind/kind.yaml), so the Location header has
  # to carry that port. Without it the redirect points at a closed port.
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: http-to-https
    patch: |
      - op: add
        path: /spec/rules/0/filters/0/requestRedirect/port
        value: 8443

  # Point the Gateway at the proxy config that pins the node ports.
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: tally
    patch: |
      - op: add
        path: /spec/infrastructure
        value:
          parametersRef:
            group: gateway.envoyproxy.io
            kind: EnvoyProxy
            name: tally-proxy-config

  # The image is built locally and side-loaded with `kind load`, so pulling it
  # would only ever fail.
  - target:
      kind: Deployment
      name: reporting-api
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # The image is built locally and side-loaded with `kind load`, so pulling it
  # would only ever fail.
  - target:
      kind: CronJob
      name: tally-engine
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # The three strategic merge patches in this file. They merge env entries by
  # name, so each names only the variables it sets instead of indexing into the
  # base env list, where a reorder in the base would move the values onto the
  # wrong variables.
  #
  # The root URL carries the 8443 host port for the same reason the redirect
  # above does: kind publishes https there, so a link Grafana renders without
  # the port sends the browser to a closed port. The anonymous settings give an
  # unauthenticated request the viewer role, which reads dashboards and saves
  # nothing; admin still signs in with the generated password.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            containers:
              - name: grafana
                env:
                  - name: GF_SERVER_ROOT_URL
                    value: https://grafana.tally.127-0-0-1.nip.io:8443
                  - name: GF_AUTH_ANONYMOUS_ENABLED
                    value: "true"
                  - name: GF_AUTH_ANONYMOUS_ORG_ROLE
                    value: Viewer

  # The placeholder external URL, in the host-port form for the same reason.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vmalert
      spec:
        template:
          spec:
            containers:
              - name: vmalert
                env:
                  - name: VMALERT_EXTERNAL_URL
                    value: https://vmalert.tally.127-0-0-1.nip.io:8443

  # The same placeholder on the other side of the pair.
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: alertmanager
      spec:
        template:
          spec:
            containers:
              - name: alertmanager
                env:
                  - name: ALERTMANAGER_EXTERNAL_URL
                    value: https://alertmanager.tally.127-0-0-1.nip.io:8443
