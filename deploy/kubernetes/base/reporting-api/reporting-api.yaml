apiVersion: v1
kind: Service
metadata:
  name: reporting-api
  labels:
    app.kubernetes.io/name: reporting-api
spec:
  selector:
    app.kubernetes.io/name: reporting-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-api
  labels:
    app.kubernetes.io/name: reporting-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting-api
    spec:
      initContainers:
        # The service is useless without its database, and crash-looping while
        # Postgres initializes buries the real startup logs.
        - name: wait-for-timescaledb
          image: busybox:1.37
          command:
            - sh
            - -c
            - "until nc -z timescaledb 5432; do echo waiting for timescaledb; sleep 2; done"
      containers:
        - name: reporting-api
          image: tally-reporting:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TALLY_HTTP_PORT
              value: "8080"
            # Secrets follow the *_FILE convention so they arrive as a mounted
            # file rather than an environment value.
            - name: TALLY_DB_URL_FILE
              value: /run/secrets/tally/db-url
          volumeMounts:
            - name: db-credentials
              mountPath: /run/secrets/tally
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: db-credentials
          secret:
            secretName: tally-db
            items:
              - key: db-url
                path: db-url
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reporting-api
spec:
  parentRefs:
    - name: tally
      sectionName: https
  hostnames:
    - api.tally.example.com
  rules:
    - backendRefs:
        - name: reporting-api
          port: 80
