# The metrics store. Retention is 13 months so a full billing year plus the
# current month is always queryable.
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
# The in-cluster scrape jobs discover their targets through the Kubernetes API
# (scrape.yaml), which is what these three objects are for. Discovery of the
# endpointslice role reads endpointslices plus the pod and service objects it
# takes its labels from, and nothing else. A Role rather than a ClusterRole
# because the jobs discover in their own namespace alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: victoriametrics-scrape
  labels:
    app.kubernetes.io/name: victoriametrics
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: victoriametrics-scrape
  labels:
    app.kubernetes.io/name: victoriametrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: victoriametrics-scrape
subjects:
  - kind: ServiceAccount
    name: victoriametrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
    spec:
      serviceAccountName: victoriametrics
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.148.0
          args:
            - -retentionPeriod=13
            - -promscrape.config=/etc/vm/scrape.yaml
            - -storageDataPath=/victoria-metrics-data
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: scrape-config
              mountPath: /etc/vm
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: scrape-config
          configMap:
            name: victoriametrics-scrape
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics
spec:
  parentRefs:
    - name: tally
      sectionName: https
  hostnames:
    - vm.tally.example.com
  rules:
    - backendRefs:
        - name: victoriametrics
          port: 8428
