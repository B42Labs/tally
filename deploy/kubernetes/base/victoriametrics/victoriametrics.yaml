# The metrics store. Retention is 13 months so a full billing year plus the
# current month is always queryable.
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.148.0
          args:
            - -retentionPeriod=13
            - -promscrape.config=/etc/vm/scrape.yaml
            - -storageDataPath=/victoria-metrics-data
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: scrape-config
              mountPath: /etc/vm
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: scrape-config
          configMap:
            name: victoriametrics-scrape
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics
spec:
  parentRefs:
    - name: tally
      sectionName: https
  hostnames:
    - vm.tally.example.com
  rules:
    - backendRefs:
        - name: victoriametrics
          port: 8428
