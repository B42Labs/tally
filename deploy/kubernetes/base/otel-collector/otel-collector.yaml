apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          # The limit is what config.yaml's memory_limiter takes its
          # percentages from: it reads the cgroup limit, so without one here it
          # has nothing to limit against and the process would grow until the
          # node evicts pods.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            # Secrets follow the same convention as the Reporting API's: they
            # arrive as a mounted file rather than an environment value.
            - name: otlp-credentials
              mountPath: /run/secrets/tally-otlp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: otlp-credentials
          secret:
            secretName: tally-otlp-auth
            items:
              - key: htpasswd
                path: htpasswd
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-collector-http
spec:
  parentRefs:
    - name: tally
      sectionName: https
  hostnames:
    - otlp.tally.example.com
  rules:
    - backendRefs:
        - name: otel-collector
          port: 4318
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: otel-collector-grpc
spec:
  parentRefs:
    - name: tally
      sectionName: https
  hostnames:
    - otlp-grpc.tally.example.com
  rules:
    - backendRefs:
        - name: otel-collector
          port: 4317
