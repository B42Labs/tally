# The Reporting API's database. It is reachable from outside the cluster through
# the Gateway's TCP listener, which is what lets `make migrate` and psql run
# against it without a port-forward.
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  labels:
    app.kubernetes.io/name: timescaledb
spec:
  selector:
    app.kubernetes.io/name: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  labels:
    app.kubernetes.io/name: timescaledb
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tally_reporting
            - name: POSTGRES_USER
              value: tally
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tally-db
                  key: password
            # The password 02-create-engine-reader.sh creates the engine's
            # login role with. It is a key of its own rather than the superuser
            # password above, and it lives in the secret rather than in this
            # directory, which dev and prod share: a password written into the
            # base would be the password of every deployment built on it.
            - name: TALLY_ENGINE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tally-db
                  key: engine-password
                  # Optional because kubelet resolves this on every container
                  # start while the script that reads it runs against an empty
                  # data directory alone. A secret that lost the key would
                  # otherwise hold the pod in CreateContainerConfigError and
                  # take the reporting database down over a value that start
                  # would not have read anyway. The start that does read it
                  # still fails on the script's own guard.
                  optional: true
            # The volume root holds lost+found, which Postgres refuses to
            # initialize into, so the cluster lives one level down.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Mounting the whole directory would hide the initdb scripts the
            # image ships there, and those install the timescaledb extension,
            # so the scripts go in beside them one file at a time. The Postgres
            # entrypoint runs that directory's scripts only against an empty
            # data directory, so on a fresh volume's first start these create
            # the tally_engine database and the roles the engine reads the
            # reporting database through. A dev cluster whose volume predates a
            # mount needs one `make down && make up` before what it creates
            # exists.
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/01-create-engine-db.sql
              subPath: 01-create-engine-db.sql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/02-create-engine-reader.sh
              subPath: 02-create-engine-reader.sh
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tally", "-d", "tally_reporting"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tally", "-d", "tally_reporting"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        # kustomize's name-reference transformer rewrites this to the generated
        # name, which carries the hash of the script's content.
        - name: initdb
          configMap:
            name: timescaledb-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
# TCP routing is by listener port, so the hostname a client uses is cosmetic:
# anything reaching :5432 on the Gateway lands here.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: timescaledb
spec:
  parentRefs:
    - name: tally
      sectionName: postgres
  rules:
    - backendRefs:
        - name: timescaledb
          port: 5432
