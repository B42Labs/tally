apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - timescaledb.yaml

# Generating the ConfigMap from the file means editing 01-create-engine-db.sql
# re-rolls the pod through the generated name hash, rather than leaving it
# mounting a script that is no longer in the repository. The roll by itself does
# not re-run the script; timescaledb.yaml records what does.
configMapGenerator:
  - name: timescaledb-initdb
    files:
      - 01-create-engine-db.sql
