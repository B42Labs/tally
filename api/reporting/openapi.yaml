# Contract for the Reporting API. This document is the source of truth for the
# wire format; internal/reporting/httpapi/openapi.gen.go is generated from it by
# `make generate` and committed alongside it.
#
# The version is 3.0.3, not the 3.1 named in roadmap/00-conventions.md section 1:
# oapi-codegen and kin-openapi, which that same section fixes as the generator
# and the request-validation middleware, read OpenAPI 3.0 documents only.
#
# There is no `servers` block on purpose. The kin-openapi router matches a
# request path against the server URLs when they are present, so listing them
# would tie the validator to a fixed set of hostnames while the service answers
# on the cluster-internal address, the Gateway hostname, and localhost alike.
openapi: 3.0.3

info:
  title: Tally Reporting API
  version: 0.1.0
  description: >-
    Event ingestion, resource inventory, and usage reporting for Tally.
    This document covers the health probes, event ingestion, the queries over
    events, resources, and lifecycles, the resource-type registry, the project
    registry, dead-letter review, and the projection rebuild.

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: >-
        Reports whether the process should keep running. It fails only after the
        service has been unhealthy for longer than the configured threshold, so
        that a transient database outage restarts nothing.
      responses:
        "200":
          description: The service is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: >-
        Reports whether the service can serve traffic. It fails while the
        database is unreachable, which takes the pod out of rotation without
        restarting it.
      responses:
        "200":
          description: The service is ready to serve traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/v1/events:
    get:
      operationId: listEvents
      summary: List stored events
      description: >-
        Returns every stored event, narrowed by whichever filters the request
        carries. The order is `(timestamp, event_id)` ascending. `from` and `to`
        select the half-open window `[from, to)` on the event timestamp: an
        event at exactly `from` is served, one at exactly `to` is not.

        One call answers one page. `items` carries the events, and
        `next_cursor` is what the next call passes as `cursor`; a null
        `next_cursor` is the end of the walk. The cursor holds a position and
        nothing else, so presenting it together with other filters is well
        defined: the filters of that call apply from that position onwards.

        This list is event-scoped rather than resource-scoped. A project token
        reads every event whose `project_id` names one of its projects,
        including the events a resource carried before it was transferred
        away. The per-resource reads scope every event the same way, so a
        transfer moves the resource to its new project without handing that
        project the history the resource carried under the old one.
      security:
        - apiToken: []
      parameters:
        - name: cloud
          in: query
          description: Serve only the events of this cloud.
          schema:
            type: string
        - name: platform
          in: query
          description: Serve only the events of this platform.
          schema:
            type: string
        - name: project_id
          in: query
          description: >-
            Serve only the events of this project, named the way its cloud
            names it. A token asking for a project outside its scope is
            answered 403.
          schema:
            type: string
        - name: resource_type
          in: query
          description: Serve only the events about resources of this type.
          schema:
            type: string
        - name: event_type
          in: query
          description: >-
            Serve only the events of this type, volume.create for example.
          schema:
            type: string
        - name: source
          in: query
          description: Serve only the events the named pipeline produced.
          schema:
            type: string
            enum: [collector, reconciliation]
        - name: from
          in: query
          description: >-
            Serve only the events at or after this instant, the inclusive bound
            of the window.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: >-
            Serve only the events before this instant, the exclusive bound of
            the window.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: How many events one page carries at most.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of stored events.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: ingestEvents
      summary: Ingest events
      description: >-
        Stores a batch of canonical events. The body is either one event or an
        array of at most 1000 of them.

        The answer is 200 whenever the request itself was authorized and
        readable, whatever the individual items did: an item this API refuses is
        kept server-side with the reason it was refused and reported in
        `rejected`. A collector may therefore drop the whole batch from its
        buffer once the call returns, and must not retry a rejected item.
      security:
        - ingestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/EventInput"
                - type: array
                  items:
                    $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: The batch was processed. The body says what happened to it.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/resources:
    get:
      operationId: listResources
      summary: List the current resources
      description: >-
        Returns the projection rows, one per resource, narrowed by whichever
        filters the request carries. The order is
        `(cloud, resource_type, resource_id)` ascending.

        One call answers one page. `items` carries the rows, and `next_cursor`
        is what the next call passes as `cursor`; a null `next_cursor` is the
        end of the walk. The cursor holds a position and nothing else, so
        presenting it together with other filters is well defined: the filters
        of that call apply from that position onwards.

        A deleted resource keeps its row, with `state` deleted and `deleted_at`
        set. Rows are never removed, so a resource that is gone stays readable
        here and through its history.

        A project token reads the rows whose (cloud, project_id) pair one of
        its projects names. The pair is what decides, so a project id another
        cloud uses for something else stays out of the answer.
      security:
        - apiToken: []
      parameters:
        - name: cloud
          in: query
          description: Serve only the resources of this cloud.
          schema:
            type: string
        - name: platform
          in: query
          description: Serve only the resources of this platform.
          schema:
            type: string
        - name: project_id
          in: query
          description: >-
            Serve only the resources of this project, named the way its cloud
            names it. A token asking for a project outside its scope is
            answered 403.
          schema:
            type: string
        - name: resource_type
          in: query
          description: Serve only the resources of this type.
          schema:
            type: string
        - name: state
          in: query
          description: >-
            Serve only the resources whose current state is exactly this,
            shutoff for example.
          schema:
            type: string
        - name: status
          in: query
          description: >-
            Which part of the fleet to serve. `active` serves the rows whose
            state is not deleted, `deleted` serves those alone, and `all`
            serves both. `state` and `status` are independent filters, so a
            contradictory pair such as `state=active&status=deleted` yields the
            empty page.
          schema:
            type: string
            enum: [active, deleted, all]
            default: active
        - name: limit
          in: query
          description: How many resources one page carries at most.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of current resources.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/resources/{cloud}/{resource_type}/{resource_id}/events:
    parameters:
      - name: cloud
        in: path
        required: true
        description: The installation the resource lives in, os-prod-eu1 for example.
        schema:
          type: string
      - name: resource_type
        in: path
        required: true
        description: The kind of resource, instance or volume for example.
        schema:
          type: string
      - name: resource_id
        in: path
        required: true
        description: The resource itself, as its cloud names it.
        schema:
          type: string
    get:
      operationId: listResourceEvents
      summary: Read the event history of one resource
      description: >-
        Returns the history of one resource, ordered by
        `(timestamp, received_at, event_id)`. The answer is never paginated:
        one call carries every event the request may see, and `next_cursor` is
        always null. A resource with more than 10000 stored events is answered
        422 (`urn:tally:error:history_too_long`) rather than a truncated
        history; `GET /api/v1/events` pages such a history.

        The read is gated on the project the resource's projection row names
        today. A project token whose scope does not hold that
        (cloud, project_id) pair is answered the 404 an unknown resource gets,
        so a resource outside the scope cannot be told from one that does not
        exist. Every served event is scoped the same way, so a project reads
        the part of the history its own projects carried and no more: after a
        transfer the old project stops reading the resource here, and the new
        one reads the events stored since the transfer rather than the whole
        history. `GET /api/v1/events` is where the old project keeps reading
        the events it carried.
      security:
        - apiToken: []
      responses:
        "200":
          description: >-
            The ordered history of the resource, with `next_cursor` null.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/resources/{cloud}/{resource_type}/{resource_id}/lifecycle:
    parameters:
      - name: cloud
        in: path
        required: true
        description: The installation the resource lives in, os-prod-eu1 for example.
        schema:
          type: string
      - name: resource_type
        in: path
        required: true
        description: The kind of resource, instance or volume for example.
        schema:
          type: string
      - name: resource_id
        in: path
        required: true
        description: The resource itself, as its cloud names it.
        schema:
          type: string
    get:
      operationId: getResourceLifecycle
      summary: Read the folded lifecycle of one resource
      description: >-
        Returns the resource's history folded into the half-open billable
        intervals of roadmap/00-conventions.md section 5, next to the
        projection row and the events the fold ran on. It is the fold the
        projection replay runs, so the intervals here are the ones every
        derived row comes from.

        `warnings` names what the fold could not trust, a history that starts
        without a create for example.

        The read is gated and scoped the way the per-resource history is: a
        resource this API holds no projection row for and a resource outside
        the token's scope are answered the same 404, the events a project token
        folds are its own projects' events, and a resource with more than 10000
        stored events is answered 422
        (`urn:tally:error:history_too_long`). Folding a scoped history is what
        keeps the intervals a project reads the spans it is billed for: a
        transferred resource is folded from the transfer onwards, which
        `warnings` reports as a history that starts without a create.

        The embedded `resource` is the projection row and is not scoped, so its
        `created_at` can predate the reader's ownership while the intervals
        start at the transfer. Bill from `intervals`.
      security:
        - apiToken: []
      responses:
        "200":
          description: The resource, its history, and the intervals it folds into.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lifecycle"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/resource-types:
    get:
      operationId: listResourceTypes
      summary: List the registered resource types
      description: >-
        Returns every registered (platform, resource_type) pair together with
        the size schema its events are checked against.
      security:
        - apiToken: []
      responses:
        "200":
          description: The registered resource types.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceTypeList"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/resource-types/{platform}/{resource_type}:
    parameters:
      - name: platform
        in: path
        required: true
        description: The platform the resource type belongs to, openstack for example.
        schema:
          type: string
      - name: resource_type
        in: path
        required: true
        description: The resource type within that platform, instance for example.
        schema:
          type: string
    get:
      operationId: getResourceType
      summary: Read one registered resource type
      security:
        - apiToken: []
      responses:
        "200":
          description: The registered resource type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: putResourceType
      summary: Register a resource type
      description: >-
        Registers the size schema of one (platform, resource_type) pair, or
        replaces the schema already registered for it. The document is compiled
        before it is stored, so a schema that does not compile is refused and
        nothing changes.
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterResourceType"
      responses:
        "200":
          description: The resource type as it is now registered.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/projects:
    post:
      operationId: createProject
      summary: Register a project
      description: >-
        Registers one project. The registry is keyed by `(cloud, external_id)`:
        a pair it already holds is answered 409 rather than replaced, so a
        repeated registration never overwrites what an operator entered before.

        The `id` the answer carries is how the other operations address the
        project. An external id alone does not, because two clouds may name
        different projects the same way.
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: The project as it is now registered.
          headers:
            Location:
              description: The URL of the created project.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listProjects
      summary: List the registered projects
      description: >-
        Returns the registered projects, narrowed by whichever filters the
        request carries. The order is `(cloud, external_id)` ascending.

        One call answers one page. `items` carries the projects, and
        `next_cursor` is what the next call passes as `cursor`; a null
        `next_cursor` is the end of the walk. The cursor holds a position and
        nothing else, so presenting it together with other filters is well
        defined: the filters of that call apply from that position onwards.
      security:
        - apiToken: []
      parameters:
        - name: platform
          in: query
          description: Serve only the projects of this platform.
          schema:
            type: string
        - name: cloud
          in: query
          description: Serve only the projects of this cloud.
          schema:
            type: string
        - name: external_id
          in: query
          description: >-
            Serve only the projects their cloud names this way. It is not a key
            on its own, so two clouds using the same external id are both
            served unless `cloud` narrows the answer.
          schema:
            type: string
        - name: limit
          in: query
          description: How many projects one page carries at most.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of registered projects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The project, as this API names it.
        schema:
          $ref: "#/components/schemas/Uuid"
    get:
      operationId: getProject
      summary: Read one registered project
      security:
        - apiToken: []
      responses:
        "200":
          description: The registered project.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      summary: Update one registered project
      description: >-
        Changes the name or the metadata of one project. A member the request
        leaves out stays as it is, and `metadata` is replaced wholesale rather
        than merged, so a request carrying it carries every member the project
        keeps.

        Neither the platform nor the `(cloud, external_id)` key is writable
        here. They are what the registry is keyed by, and a project that moves
        to another cloud is a different project.
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: The project as it now stands.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/rejected-events:
    get:
      operationId: listRejectedEvents
      summary: List the dead-lettered events
      description: >-
        Returns every ingest item this API refused server-side, with the reason
        it was refused and the raw body as it was submitted. The order is
        `(received_at, id)` ascending. `from` and `to` select the half-open
        window `[from, to)` on `received_at`, which is when the item was refused
        rather than when its event claims to have happened: an item received at
        exactly `from` is served, one received at exactly `to` is not.

        One call answers one page. `items` carries the items, and `next_cursor`
        is what the next call passes as `cursor`; a null `next_cursor` is the
        end of the walk. The cursor holds a position and nothing else, so
        presenting it together with other filters is well defined: the filters
        of that call apply from that position onwards.

        The operation is admin-only: callers below the admin role are answered
        403. No project scope applies, because the raw JSON of a refused item
        carries no reliable project attribution.
      security:
        - apiToken: []
      parameters:
        - name: from
          in: query
          description: >-
            Serve only the items refused at or after this instant, the inclusive
            bound of the window.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: >-
            Serve only the items refused before this instant, the exclusive
            bound of the window.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: How many items one page carries at most.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of dead-lettered events.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  # This route is not part of the public API: the other Tally components call it
  # with the shared internal token. It is described here because the request
  # validator refuses a path the contract does not carry, so leaving it out
  # would take the route offline rather than hide it.
  /internal/projection/rebuild:
    post:
      operationId: rebuildProjection
      summary: Rebuild the projection
      description: >-
        Replays the event history of every resource the filter selects into the
        projection and answers once it is done. It is the operational guarantee
        behind the derived rows: whatever a projection row holds, the history it
        comes from can produce it again.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebuildRequest"
      responses:
        "200":
          description: The rebuild finished.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  responses:
    # Every error response of this API is this one, so operations reference it
    # instead of repeating the schema per status code.
    Problem:
      description: The request failed. The body says how.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  headers:
    RequestID:
      description: >-
        Correlation id of this request. The server adopts the one a caller
        sends and generates one otherwise; it appears on every log line of the
        request, so quoting it in a support request is what ties the two
        together.
      schema:
        type: string

  parameters:
    # The three paginated lists declare this parameter verbatim, so it lives
    # here once: the wording a caller reads about the cursor's opacity is the
    # same on every list, and it stays that way.
    Cursor:
      name: cursor
      in: query
      description: >-
        The `next_cursor` of the page before this one. It is opaque: a
        client passes it back as it received it and reads nothing out of
        it.
      schema:
        type: string

  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457 problem detail. Every error response in this API uses this
        shape, served as application/problem+json.
      # The server always sends these three. Saying so is what lets a generated
      # client treat `type`, the code a caller branches on, as a value rather
      # than as something that might be absent.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          example: urn:tally:error:validation
        title:
          type: string
          description: Short human-readable summary of the problem type.
          example: Validation failed
        status:
          type: integer
          description: The HTTP status code of this response.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        errors:
          type: array
          description: Per-field details, set when the problem is a validation failure.
          items:
            type: object
            required: [loc, msg]
            properties:
              loc:
                type: string
                description: Location of the offending value, e.g. body.resource_id.
              msg:
                type: string
                description: What is wrong with the value at that location.

    # The shape every id in a path is constrained to. It lives here rather than
    # at each parameter, so that the copies cannot drift apart; what an id names
    # stays with the parameter, because that differs per route.
    Uuid:
      type: string
      format: uuid
      # The request validator checks a pattern and ignores an unregistered
      # format, so the RFC 4122 shape is spelled out here as well. That is
      # what answers a malformed id with the contract's 400 rather than
      # letting the generated binding fail behind the validator.
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

    # This schema constrains nothing, and that is load-bearing rather than
    # sloppy. It is what the request validator applies to a whole batch, so a
    # typed member here would answer 500 well-formed events with one 400 because
    # the 501st spells its timestamp wrong. WP 1.6 requires the opposite: the one
    # bad item is kept as a dead letter and its siblings are stored. The rules
    # that decide which item is bad therefore live in (*event.Event).Validate(),
    # which runs per item.
    #
    # The batch limit is enforced the same way, by the handler, which answers
    # 413. A maxItems keyword here would answer 400 instead.
    EventInput:
      type: object
      additionalProperties: true
      description: >-
        One canonical event. The members below are described rather than
        constrained; the normative schema is roadmap/00-conventions.md
        section 4.
      properties:
        event_id:
          description: >-
            Globally unique idempotency key of 1 to 256 characters. An event id
            resubmitted with the same timestamp counts as a duplicate.
        timestamp:
          description: When the event happened, ISO 8601 with a timezone.
        event_type:
          description: >-
            What happened, written resource.action with an optional phase, for
            example compute.instance.create.end.
        platform:
          description: The platform the resource lives on, openstack for example.
        cloud:
          description: The installation the resource lives in, os-prod-eu1 for example.
        resource_type:
          description: The kind of resource, instance or volume for example.
        resource_id:
          description: The resource this event is about.
        project_id:
          description: The project owning the resource at or after this event.
        source:
          description: >-
            Where the event came from. The stored event always reports the
            pipeline that ingested it, so a collector cannot mark its events as
            reconciliation output. The member may be left out; a value outside
            `collector` and `reconciliation` refuses the item.
        payload:
          description: >-
            The normalized payload envelope: the state at or after the event,
            the full replacement size when it changed, and optional raw provider
            data.

    IngestResult:
      type: object
      description: What one ingest call did with the batch it was given.
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
          description: How many events the call stored.
        duplicates:
          type: integer
          description: How many items the database already held.
        rejected:
          type: array
          description: The items the call refused, one entry each.
          items:
            $ref: "#/components/schemas/RejectedEvent"

    RejectedEvent:
      type: object
      description: One refused item and the reason it was refused.
      required: [index, event_id, reason]
      properties:
        index:
          type: integer
          description: The item's position in the submitted batch, counted from zero.
        event_id:
          type: string
          description: >-
            The event id the item carried. It is the empty string for an item
            that carried none, which is why the index is what identifies the
            item.
        reason:
          type: string
          description: >-
            Why the item was refused, for example
            "size_schema: 'vcpus' is a required property".

    StoredEvent:
      type: object
      description: >-
        One event as the events table holds it: what was submitted, plus the
        instant this API stored it.
      required: [event_id, timestamp, event_type, platform, cloud, resource_type,
                 resource_id, project_id, source, payload, received_at]
      properties:
        event_id:
          type: string
          description: The idempotency key the event was submitted under.
        timestamp:
          type: string
          format: date-time
          description: When the event happened.
        event_type:
          type: string
          description: >-
            What happened, written resource.action with an optional phase, for
            example compute.instance.create.end.
        platform:
          type: string
          description: The platform the resource lives on.
        cloud:
          type: string
          description: The installation the resource lives in.
        resource_type:
          type: string
          description: The kind of resource the event is about.
        resource_id:
          type: string
          description: The resource the event is about.
        project_id:
          type: string
          description: The project owning the resource at or after this event.
        source:
          type: string
          description: >-
            Which pipeline produced the event, collector or reconciliation. It
            is what the server recorded rather than what the submitter claimed.
        payload:
          type: object
          nullable: true
          description: >-
            The normalized payload envelope, member for member as it was
            stored. It is null for an event stored without one, which a delete
            event may be. The members are not constrained here: an envelope
            keeps the fields a provider sent beyond the ones this API names.
        received_at:
          type: string
          format: date-time
          description: When this API stored the event.

    EventList:
      type: object
      description: One page of stored events.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The events of this page, ordered by timestamp and event id.
          items:
            $ref: "#/components/schemas/StoredEvent"
        next_cursor:
          type: string
          nullable: true
          description: >-
            Where the next page starts, passed back as `cursor`. It is null on
            the last page.

    Resource:
      type: object
      description: >-
        One resource as the projection holds it: what its event history says it
        is right now.
      required: [cloud, platform, resource_type, resource_id, project_id, state,
                 size, created_at, deleted_at, last_event_type, last_event_at,
                 last_payload]
      properties:
        cloud:
          type: string
          description: The installation the resource lives in.
        platform:
          type: string
          description: The platform the resource lives on.
        resource_type:
          type: string
          description: The kind of resource.
        resource_id:
          type: string
          description: The resource itself, as its cloud names it.
        project_id:
          type: string
          description: The project owning the resource now.
        state:
          type: string
          description: >-
            The state the resource is in now. A deleted resource carries
            deleted, which the server sets itself rather than reading it off the
            delete event.
        size:
          type: object
          description: >-
            The size the resource has now, member for member as its events
            reported it. It is the empty object for a history that reported no
            size.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the resource was created, as the projection folded it from the
            resource's whole history. It is null for a history that never showed
            a create. The projection is not scoped to the reading token, so on a
            resource that changed projects this is the create of the project it
            came from and predates the reader's ownership: what a project is
            billed for is the lifecycle's `intervals`, never `created_at` paired
            with `deleted_at`.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: When the resource was deleted, null while it lives.
        last_event_type:
          type: string
          description: The type of the newest event folded into this row.
        last_event_at:
          type: string
          format: date-time
          description: When that event happened.
        last_payload:
          type: object
          nullable: true
          description: >-
            The payload envelope of that event, member for member as it was
            stored, and null for a row that holds none.

    ResourceList:
      type: object
      description: One page of current resources.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: >-
            The resources of this page, ordered by cloud, resource type, and
            resource id.
          items:
            $ref: "#/components/schemas/Resource"
        next_cursor:
          type: string
          nullable: true
          description: >-
            Where the next page starts, passed back as `cursor`. It is null on
            the last page.

    LifecycleInterval:
      type: object
      description: >-
        One half-open span `[from, to)` over which nothing billable about a
        resource changed.
      required: [from, to, state, size, project_id]
      properties:
        from:
          type: string
          format: date-time
          description: When the interval starts, the inclusive bound.
        to:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the interval ends, the exclusive bound. It is null while the
            interval is open, which the last interval of a living resource is.
        state:
          type: string
          description: The state the resource was in over the interval.
        size:
          type: object
          description: The size the resource had over the interval.
        project_id:
          type: string
          description: The project owning the resource over the interval.

    Lifecycle:
      type: object
      description: >-
        One resource, its event history, and the billable intervals that
        history folds into. `resource` is always there: a resource this API
        holds no projection row for is answered 404 rather than with an empty
        lifecycle.


        The two halves are derived from two different event sets. `events` and
        `intervals` carry the history this token may read, while `resource` is
        the projection row, folded from every event the resource has under no
        scope. On a resource that changed projects the row therefore reports a
        `created_at` from before the reader owned it, and the first interval
        starts at the transfer.
      required: [resource, events, intervals, warnings]
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
        events:
          type: array
          description: >-
            The full history the fold ran on, ordered by
            `(timestamp, received_at, event_id)`.
          items:
            $ref: "#/components/schemas/StoredEvent"
        intervals:
          type: array
          description: >-
            The billable intervals the history implies, oldest first. Two
            billable changes at the same instant leave no interval between them,
            so a resource created and deleted at one instant has none at all.
          items:
            $ref: "#/components/schemas/LifecycleInterval"
        warnings:
          type: array
          description: >-
            What the fold could not trust, one entry each. A history whose first
            event is not a create carries history_starts_without_create.
          items:
            type: string

    ResourceType:
      type: object
      description: >-
        One registered resource type and the size schema the sizes reported for
        it are validated against.
      required: [platform, resource_type, size_schema, updated_at]
      properties:
        platform:
          type: string
          description: The platform the resource type belongs to.
        resource_type:
          type: string
          description: The resource type within that platform.
        size_schema:
          type: object
          description: The registered JSON Schema draft 2020-12 document.
        updated_at:
          type: string
          format: date-time
          description: When the schema was last written.

    ResourceTypeList:
      type: object
      description: The registered resource types.
      # next_cursor is required although it is null today: the server always
      # sends the member, and saying so is what makes the generated model carry
      # it rather than drop it when it is unset.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The resource types, ordered by platform and resource type.
          items:
            $ref: "#/components/schemas/ResourceType"
        next_cursor:
          type: string
          nullable: true
          description: >-
            Where the next page starts. It is always null today: the registry
            holds one row per resource type, so every registration fits into one
            answer. The registry list stays a single page, while the query lists
            page with cursors.

    RegisterResourceType:
      type: object
      description: The size schema to register for a resource type.
      required: [size_schema]
      properties:
        size_schema:
          type: object
          description: >-
            A JSON Schema draft 2020-12 document. It is compiled before it is
            stored, so the document a registration accepts is exactly the one
            ingestion can apply later.

    Project:
      type: object
      description: >-
        One registered project. The registry is keyed by
        `(cloud, external_id)`, and `id` is what the other operations address
        the project by.
      required: [id, platform, cloud, external_id, name, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The project, as this API names it.
        platform:
          type: string
          description: The platform the project lives on, openstack for example.
        cloud:
          type: string
          description: >-
            The installation the project lives in, os-prod-eu1 for example.
        external_id:
          type: string
          description: >-
            The project as its cloud names it, which is the id an event carries.
        name:
          type: string
          nullable: true
          description: >-
            What the project is called, null for a project registered without a
            name.
        metadata:
          type: object
          description: >-
            Whatever else was stored about the project. It is the empty object
            for a project registered without any.
        created_at:
          type: string
          format: date-time
          description: When the project was registered.

    ProjectList:
      type: object
      description: One page of registered projects.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The projects of this page, ordered by cloud and external id.
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: string
          nullable: true
          description: >-
            Where the next page starts, passed back as `cursor`. It is null on
            the last page.

    CreateProject:
      type: object
      description: >-
        The project to register. Its `(cloud, external_id)` pair has to be one
        the registry does not hold yet.
      required: [platform, cloud, external_id]
      properties:
        platform:
          type: string
          minLength: 1
          description: The platform the project lives on, openstack for example.
        cloud:
          type: string
          minLength: 1
          description: >-
            The installation the project lives in, os-prod-eu1 for example.
        external_id:
          type: string
          minLength: 1
          description: The project as its cloud names it.
        name:
          type: string
          minLength: 1
          description: What the project is called.
        metadata:
          type: object
          description: >-
            Whatever else is worth keeping about the project. A registration
            that leaves it out stores the empty object.

    UpdateProject:
      type: object
      description: >-
        What to change about a project. A member the request leaves out stays
        as it is, so at least one of them has to be present.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          description: What the project is called from now on.
        metadata:
          type: object
          description: >-
            The metadata the project carries from now on. It replaces the
            stored object wholesale rather than being merged into it, so a
            request carrying it carries every member the project keeps.

    # The name avoids RejectedEvent above, which is the ingest response's item
    # and a different shape: that one names the position in the submitted batch,
    # this one the dead-letter row ingestion kept.
    DeadLetteredEvent:
      type: object
      description: >-
        One ingest item this API refused, as the dead-letter table holds it.
      required: [id, received_at, reason, raw]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The dead-letter row. A refused item has no event id this API can
            trust, so the row's own id is what names it.
        received_at:
          type: string
          format: date-time
          description: When this API refused the item.
        reason:
          type: string
          description: >-
            Why ingestion refused the item, a schema violation for example,
            prefixed the way the ingest response reports it.
        raw:
          description: >-
            The item as it was submitted, with NUL characters scrubbed at
            ingest. Nothing is constrained here: what a collector sent need not
            be a JSON object, and this member carries whatever it was.

    DeadLetterList:
      type: object
      description: One page of dead-lettered events.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: >-
            The refused items of this page, ordered by received_at and id.
          items:
            $ref: "#/components/schemas/DeadLetteredEvent"
        next_cursor:
          type: string
          nullable: true
          description: >-
            Where the next page starts, passed back as `cursor`. It is null on
            the last page.

    RebuildRequest:
      type: object
      description: >-
        Which resources to replay. A member left out filters nothing, so an
        empty object rebuilds every resource the events table knows.
      properties:
        cloud:
          type: string
          description: Replay only the resources of this cloud.
        resource_type:
          type: string
          description: Replay only the resources of this type.

    RebuildResult:
      type: object
      description: What one rebuild replayed.
      required: [rebuilt]
      properties:
        rebuilt:
          type: integer
          description: How many resources were replayed.

  securitySchemes:
    # Referenced per operation by the authenticated endpoints. The health probes
    # are unauthenticated, so there is no document-wide `security`. The three
    # schemes are all bearer tokens on the wire and nothing else: they are drawn
    # from three separate stores, and a token issued for one is refused by the
    # operations of the other two.
    ingestToken:
      type: http
      scheme: bearer
      description: >-
        An ingest credential, issued per (platform, cloud) and passed as
        `Authorization: Bearer <token>`. It may report events for that pair
        alone.
    apiToken:
      type: http
      scheme: bearer
      description: >-
        An API token passed as `Authorization: Bearer <token>`. Each operation
        names the role it needs; a token below it is answered 403.
    internalToken:
      type: http
      scheme: bearer
      description: >-
        The shared secret the other Tally components call the internal routes
        with, passed as `Authorization: Bearer <token>`. It is not issued to
        public callers.
